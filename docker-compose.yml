services:

  postgres:
    image: postgis/postgis:latest
    container_name: smart-civic-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - smart-civic-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: smart-civic-backend:latest
    container_name: smart-civic-backend

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      GEMINI_API_KEY: ${GEMINI_API_KEY}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    volumes:
      - ./uploads:/app/uploads

    ports:
      - "8080:8080"

  frontend:
    image: smart-civic-frontend:latest
    container_name: smart-civic-frontend

    depends_on:
      - backend

    ports:
      - "5173:80"

volumes:
  smart-civic-postgres-data: